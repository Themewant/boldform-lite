name: Build & attach plugin zip

# Produces a Plugin-Check-clean distributable (internal folder = "boldform-lite/",
# dev files stripped via .distignore) and attaches it to each GitHub release.
# Users should download this "boldform-lite.zip" asset — NOT the auto-generated
# "Source code (zip)", whose folder is versioned (boldform-lite-<tag>/) and fails Plugin Check.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build tooling
        run: npm install --no-audit --no-fund

      - name: Build distributable zip
        run: npm run build

      - name: Normalize asset name (unversioned)
        run: cp build/boldform-lite-*.zip boldform-lite.zip

      - name: Attach zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" boldform-lite.zip --clobber

      - name: Upload zip as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: boldform-lite-zip
          path: boldform-lite.zip
